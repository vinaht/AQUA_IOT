<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Giám sát nước ao nuôi cá rô phi đỏ</title>
<style>
body{font:17px system-ui;max-width:880px;margin:24px auto;padding:16px;color:#18333d;background:#f2f6f7}
button,input{font:inherit;padding:7px;margin:4px}article,pre{background:white;padding:14px}
article{border-left:5px solid #357e8c;margin:12px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:6px;border-bottom:1px solid #dde5e7}
.signal-ok{color:#17643d;background:#edf8f0}.signal-alert{color:#a52c15;background:#fff0eb}
.signal-neutral{color:#586b73}.indicator{font-weight:700;margin-right:6px}
.legend{font-size:14px}.legend span{display:inline-block;padding:3px 8px;margin-right:8px}
#cards.disconnected td{color:#586b73;background:#eef1f2}#cards.disconnected .indicator{visibility:hidden}
article{overflow-x:auto}
</style>
<h1>Giám sát nước ao nuôi cá rô phi đỏ</h1>
<label><input id="sound" type="checkbox">Âm thanh cảnh báo</label>
<p id="status" role="status">Đang kết nối máy chủ…</p>
<p class="legend"><span class="signal-ok">✓ Trong ngưỡng</span><span class="signal-alert">▲ Vượt ngưỡng</span><span class="signal-neutral">— Chưa đánh giá</span></p>
<div id="cards"></div><p id="evaluation"></p>
<button id="csv">Tải số đo CSV</button><button id="forecasts">Tải dự báo CSV</button>
<details><summary>Số đo mới nhất</summary><pre id="data"></pre></details>
<details><summary>Nhật ký trạng thái</summary><pre id="events"></pre></details>
<script>
const el = id => document.getElementById(id);
const specs = [
  ['ph','pH','current_ph','',2],
  ['temperature_c','Nhiệt độ','current_temperature_c',' °C',2],
  ['tds_ppm','TDS','tds_ppm',' ppm',1]
];
const states = {ready:'Đã có dự báo', history:'Đang tích lũy dữ liệu', sensor:'Thiếu số đo hợp lệ',
  inputs:'Thiếu đầu vào mô hình', model:'Kiểm tra mô hình và phiên bản thư viện', warming_up:'Đang chờ dữ liệu',
  calibration:'Đang hiệu chuẩn', stale:'Mất dữ liệu mới', clock_error:'Kiểm tra đồng hồ máy tính', ph_quality:'Kiểm tra số đo pH'};
const limits = {ph:['ph_low','ph_high'], temperature_c:['temp_low','temp_high'], tds_ppm:[null,'tds_high']};
let audio;
// Preserve each last known threshold state across missing data and network errors.
const alarmStates = new Map();
async function get(path){
  const controller=new AbortController(), timeout=setTimeout(()=>controller.abort(),10000);
  let r;
  try { r=await fetch(path,{signal:controller.signal}); }
  finally { clearTimeout(timeout); }
  if(!r.ok) throw Error('HTTP '+r.status);
  return r;
}
function add(parent,tag,text){
  const node=document.createElement(tag);node.textContent=text;parent.append(node);return node;
}
function beep(){
  if(!el('sound').checked || !audio || audio.state!=='running') return;
  const tone=audio.createOscillator(), gain=audio.createGain();tone.frequency.value=660;
  gain.gain.value=.12;tone.connect(gain);gain.connect(audio.destination);
  tone.onended=()=>{tone.disconnect();gain.disconnect();};
  tone.start();tone.stop(audio.currentTime+.25);
}
function signal(d,field,value){
  if(!Number.isFinite(value) || ['stale','clock_error','calibration','no_data'].includes(d.state)
      || d.channels?.[field]?.state==='sensor') return 'neutral';
  const [low,high]=limits[field], c=d.thresholds;
  const hasLow=Number.isFinite(c[low]), hasHigh=Number.isFinite(c[high]);
  if(!hasLow && !hasHigh) return 'neutral';
  return (hasLow && value<c[low]) || (hasHigh && value>c[high]) ? 'alert' : 'ok';
}
function measurement(row,text,state){
  const cell=add(row,'td','');cell.className='signal-'+state;
  if(state!=='neutral'){
    const icon=add(cell,'span',state==='alert'?'▲':'✓');icon.className='indicator';
    icon.setAttribute('role','img');icon.setAttribute('aria-label',state==='alert'?'Vượt ngưỡng':'Trong ngưỡng');
  }
  add(cell,'span',text);
}
function updateAlarms(devices){
  let entered=false;
  for(const d of devices){
    for(const [field,,current] of specs){
      for(const [phase,value] of [['current',d[current]],['forecast',d.forecast?.[field]]]){
        const state=signal(d,field,value);
        if(state==='neutral') continue;
        const key=JSON.stringify([d.device_id,field,phase]);
        if(state==='alert' && alarmStates.get(key)!=='alert') entered=true;
        alarmStates.set(key,state);
      }
    }
  }
  if(entered) beep();
}
function card(d){
  const a=document.createElement('article'), f=d.forecast, c=d.thresholds;
  add(a,'strong',d.device_id+' · '+(states[d.state] || d.state));
  if(f) add(a,'p','Thời điểm dự báo: '+new Date(f.target_utc).toLocaleString('vi-VN'));
  const table=add(a,'table',''), header=table.insertRow();
  for(const text of ['Thông số','Hiện tại','Sau 30 phút','Khoảng / mốc']) add(header,'th',text);
  for(const [field,label,current,unit,digits] of specs){
    const row=table.insertRow(), ch=d.channels?.[field];
    const format=x=>Number.isFinite(x)?x.toFixed(digits)+unit:'—';
    let forecast=format(f?.[field]);
    if(!Number.isFinite(f?.[field]) && ch){
      forecast='— · '+(states[ch.state] || 'Chưa có');
      if(ch.state==='history') forecast+=' ('+ch.minutes+'/15 phút)';
    }
    const bounds=field==='tds_ppm'?(c.tds_high==null?'—':'≤ '+c.tds_high+' ppm'):
      field==='ph'?(c.ph_low==null?'—':c.ph_low+'–'+c.ph_high):
      (c.temp_low==null?'—':c.temp_low+'–'+c.temp_high+' °C');
    add(row,'td',label);
    measurement(row,format(d[current]),signal(d,field,d[current]));
    measurement(row,forecast,signal(d,field,f?.[field]));
    add(row,'td',bounds);
  }
  return a;
}
async function refresh(){
  try{
    const [read,f]=await Promise.all(['/api/latest','/api/forecast'].map(async url=>(await get(url)).json()));
    el('cards').classList.remove('disconnected');
    el('cards').replaceChildren(...f.devices.map(card));
    el('data').textContent=JSON.stringify(read,null,2);el('events').textContent=JSON.stringify(f.recent_events,null,2);
    el('status').textContent=f.devices.length?'Đã kết nối máy chủ':'Đang chờ ESP32';
    el('evaluation').textContent=specs.map(([field,label,,unit,digits])=>{
      const e=f.evaluation.channels[field];return label+': '+e.matched_count+
        ' dự báo đã đối chiếu'+(e.mae==null?'':' · MAE '+e.mae.toFixed(digits)+unit);
    }).join(' | ');
    updateAlarms(f.devices);
  } catch(e){
    el('status').textContent='Mất kết nối · Đang thử lại · Số đo hiển thị là lần nhận trước';
    el('cards').classList.add('disconnected');
  } finally {
    setTimeout(refresh,3000);
  }
}
el('sound').onchange=async()=>{
  if(!el('sound').checked) return;
  try { audio=audio || new AudioContext();await audio.resume(); }
  catch(e){el('sound').checked=false;el('status').textContent='Không bật được âm thanh trên trình duyệt này';}
};
async function download(path,name){
  try{const blob=await (await get(path)).blob(),url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
  }catch(e){el('status').textContent=e.message;}
}
el('csv').onclick=()=>download('/export.csv','water_readings.csv');
el('forecasts').onclick=()=>download('/forecasts.csv','water_forecasts.csv');
refresh();
</script></html>
