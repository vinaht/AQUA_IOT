<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Giám sát và dự báo pH</title>
<style>body{font:17px system-ui;max-width:880px;margin:24px auto;padding:20px;background:#f2f6f7;color:#18333d}button,input{padding:10px;margin:5px}article,pre{background:white;padding:18px;border-radius:12px;white-space:pre-wrap}article{margin:12px 0;border-left:6px solid #357e8c}.warn{border-color:#bd4828;background:#fff2e9}small{display:block;color:#52656a}#status{font-weight:bold}</style>
<h1>Giám sát và dự báo pH</h1><input id="key" type="password" placeholder="API_KEY"><button id="connect">Kết nối</button><label><input id="sound" type="checkbox">Âm thanh cảnh báo</label><p id="status">Chưa kết nối</p><div id="cards"></div><p id="evaluation"></p><button id="csv">Tải số đo CSV</button><button id="forecasts">Tải dự báo CSV</button><details><summary>Số đo mới nhất</summary><pre id="data"></pre></details><details><summary>Nhật ký trạng thái gần nhất</summary><pre id="events"></pre></details><p>Dự báo pH: trung bình 15 phút gần nhất → thời điểm sau 30 phút. Cảnh báo theo ngưỡng tự cấu hình. Chưa có dự báo nhiệt độ.</p>
<script>
let key='',timer,audio,lastSignature='';
const el=id=>document.getElementById(id);
const states={no_data:'Chưa có dữ liệu',clock_error:'Kiểm tra đồng hồ máy tính',stale:'Mất dữ liệu mới',calibration:'Đang đo dung dịch chuẩn — chưa dự báo',ph_quality:'pH lỗi hoặc ngoài khoảng hiệu chuẩn',warming_up:'Đang tích lũy 15 phút dữ liệu',ready:'Đã có dự báo'};
const names={current_outside:'pH hiện tại vượt ngưỡng đã đặt',forecast_outside:'pH dự báo sau 30 phút vượt ngưỡng đã đặt'};
async function get(path){const r=await fetch(path,{headers:{'X-API-Key':key}});if(!r.ok)throw Error('HTTP '+r.status);return r;}
function beep(){if(!el('sound').checked||!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=660;g.gain.value=.12;o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.25);}
async function refresh(){try{const [read,f]=await Promise.all([(await get('/api/latest')).json(),(await get('/api/forecast')).json()]);el('data').textContent=JSON.stringify(read,null,2);el('events').textContent=JSON.stringify(f.recent_events,null,2);el('cards').replaceChildren();const signals=[];for(const d of f.devices){const a=document.createElement('article');const warn=d.warnings.length||['stale','ph_quality','clock_error'].includes(d.state);if(warn)a.className='warn';let msg=d.device_id+'\n'+states[d.state]+'\npH hiện tại: '+(d.current_ph??'--');if(d.age_seconds!==undefined)msg+='\nMẫu nhận '+d.age_seconds+' giây trước';if(d.minutes_ready!==undefined)msg+='\nPhút đủ dữ liệu: '+d.minutes_ready+'/15';if(d.forecast)msg+='\npH dự báo: '+d.forecast.ph.toFixed(3)+'\nCho thời điểm: '+new Date(d.forecast.target_utc).toLocaleString('vi-VN');msg+='\n'+(d.thresholds.ph_low===null?'Chưa đặt ngưỡng cảnh báo pH.':'Ngưỡng: '+d.thresholds.ph_low+'–'+d.thresholds.ph_high);if(d.warnings.length)msg+='\n'+d.warnings.map(w=>names[w]).join('\n');a.textContent=msg;el('cards').append(a);if(warn)signals.push([d.device_id,d.state,d.warnings]);}const sig=JSON.stringify(signals);if(signals.length&&sig!==lastSignature)beep();lastSignature=sig;el('status').textContent=f.devices.length?'Đã kết nối máy chủ':'Đang chờ ESP32';const e=f.evaluation;el('evaluation').textContent='Số dự báo đã đối chiếu: '+e.matched_count+(e.matched_count?' | MAE: '+e.mae.toFixed(3)+' | MAE giữ nguyên: '+e.baseline_mae.toFixed(3):' — chờ số đo sau 30 phút.');}catch(e){el('status').textContent='Không nhận được dữ liệu: '+e.message;el('cards').replaceChildren();}}
el('connect').onclick=()=>{key=el('key').value.trim();if(!/^[\x21-\x7e]+$/.test(key)){el('status').textContent='API_KEY phải là chuỗi khóa từ server, không có dấu hoặc khoảng trắng.';return;}clearInterval(timer);refresh();timer=setInterval(refresh,3000);};
el('sound').onchange=()=>{if(el('sound').checked){audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume();}};
async function download(path,name){try{const r=await get(path),u=URL.createObjectURL(await r.blob()),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}catch(e){el('status').textContent=e.message;}}
el('csv').onclick=()=>download('/export.csv','water_readings.csv');el('forecasts').onclick=()=>download('/forecasts.csv','ph_forecasts.csv');
</script></html>
